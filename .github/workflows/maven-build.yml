name: MoveWise API Java CI

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  build-main:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: movewise
          POSTGRES_PASSWORD: movewisepassword
          POSTGRES_DB: movewise_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -p 5432 -U movewise && break
            echo "Waiting for PostgreSQL..."
            sleep 5
          done

      - name: Build and test with Maven (using test profile)
        run: mvn --batch-mode clean verify -Dspring.profiles.active=test
        working-directory: movewise-api
