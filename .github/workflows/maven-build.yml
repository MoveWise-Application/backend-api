# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

name: MoveWise API Java CI

on:
  pull_request:
    branches:
      - main
      - dev

  # schedule:
  #   - cron: "0 1 * * *"

jobs:
  build-main:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Start SQL Server
        run: |
          docker run -e 'ACCEPT_EULA=Y' -e 'SA_PASSWORD=12345' \
            -p 1433:1433 --name sqlserver -d mcr.microsoft.com/mssql/server:2022-latest

          # Wait for SQL Server to be ready
          sleep 20

          # Create database MoveWise
          docker exec -i sqlserver /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P '12345' -Q "CREATE DATABASE MoveWise;"

      - name: Build and test with Maven
        run: mvn --batch-mode package
        working-directory: movewise-api
